name: "✨ Feature Request"
description: "Suggest a new idea, connector, or feature for HUNTFLOW"
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: "Feature Description"
      description: "A clear and concise description of what you would like to see added."
      placeholder: "I would like HUNTFLOW to support..."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: "Use Case & Value"
      description: "Why would this feature be useful?"
      placeholder: "This would allow candidates to..."
    validations:
      required: true
