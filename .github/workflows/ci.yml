name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & Env Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure no real .env files or secrets in tracked files
        run: |
          echo "Auditing repository for accidental .env or secret commits..."
          COMMITTED_ENV=$(git ls-files | grep -iE '(^|/)\.env($|\.(local|prod|dev|staging|development|production|test))' || true)
          if [ -n "$COMMITTED_ENV" ]; then
            echo "::error::Sensitive .env file found tracked in git: $COMMITTED_ENV"
            exit 1
          fi
          echo "No sensitive .env files tracked. Secret audit passed."

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate Environment Examples
        run: node scripts/check-env-examples.mjs

  quality-node:
    name: Node Quality & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install LaTeX toolchain for resume integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Source Registry Schema Validation
        run: npm run sources:validate

      - name: ESLint & TypeScript Typecheck
        run: npm run check

      - name: Run Full Vitest Test Suite
        run: npm test

  quality-python:
    name: Python Quality & Sidecar Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.10

      - name: Install sidecar dependencies
        working-directory: scrapling-agent
        run: uv sync --group dev

      - name: Ruff Linter Check
        working-directory: scrapling-agent
        run: uv run ruff check .

      - name: Run Pytest Contract & Connector Suite
        working-directory: scrapling-agent
        run: uv run pytest

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [secret-scan, quality-node, quality-python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Standalone
        run: npm run build

  gate:
    name: CI / Gate
    if: ${{ always() }}
    needs: [secret-scan, quality-node, quality-python, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          SECRET_SCAN_RESULT: ${{ needs['secret-scan'].result }}
          QUALITY_NODE_RESULT: ${{ needs.quality-node.result }}
          QUALITY_PYTHON_RESULT: ${{ needs.quality-python.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$SECRET_SCAN_RESULT" "$QUALITY_NODE_RESULT" "$QUALITY_PYTHON_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::CI prerequisite finished with: $result"
              exit 1
            fi
          done
          echo "CI gate passed."
