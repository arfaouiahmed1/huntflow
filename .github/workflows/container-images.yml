name: Build and Publish Container Images

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "src/**"
      - "scrapling-agent/**"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: huntflow-web
            context: .
            file: ./Dockerfile
          - image: huntflow-agent
            context: ./scrapling-agent
            file: ./scrapling-agent/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arfaouiahmed1/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
