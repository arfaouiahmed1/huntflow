    <circle cx="12" cy="12" r="3.5" fill="#10B981" />
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#10B981" letter-spacing="0.08em" x="22" y="15.5">AUTONOMOUS AGENT</text>

