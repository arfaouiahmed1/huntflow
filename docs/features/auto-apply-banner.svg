<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-#10B981" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#090C15" />
    </radialGradient>
    <filter id="glow-#10B981" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-#10B981)" />
  <rect width="998" height="238" x="1" y="1" rx="15" stroke="#1E293B" stroke-width="1.5" />

  <!-- Accent glow corner -->
  <circle cx="80" cy="80" r="140" fill="#10B981" fill-opacity="0.06" />

  <!-- Left Icon Container -->
  <g transform="translate(48, 48)">
    <rect width="72" height="72" rx="18" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
    <g transform="translate(20, 20)" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="16" cy="16" r="12" /><line x1="16" y1="4" x2="16" y2="8" /><line x1="16" y1="24" x2="16" y2="28" /><line x1="4" y1="16" x2="8" y2="16" /><line x1="24" y1="16" x2="28" y2="16" />
    </g>
  </g>

  <!-- Header & Title -->
