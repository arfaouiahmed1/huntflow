    <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94A3B8" x="0" y="86">
      Analyze, pitch, prefill, and execute job applications using the local Scrapling browser agent.
    </text>
  </g>

  <!-- Details Row Grid -->
  <g transform="translate(144, 160)">
    
      <g transform="translate(0, 0)">
        <rect width="245" height="52" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="26" r="4" fill="#10B981" />
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0" x="30" y="24">5-Step Agent Loop</text>
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#64748B" x="30" y="40">Analyze → Prepare → Execute</text>
