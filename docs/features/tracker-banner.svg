<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-#C6F135" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#090C15" />
    </radialGradient>
    <filter id="glow-#C6F135" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-#C6F135)" />
  <rect width="998" height="238" x="1" y="1" rx="15" stroke="#1E293B" stroke-width="1.5" />

  <!-- Accent glow corner -->
  <circle cx="80" cy="80" r="140" fill="#C6F135" fill-opacity="0.06" />

  <!-- Left Icon Container -->
  <g transform="translate(48, 48)">
    <rect width="72" height="72" rx="18" fill="#0F172A" stroke="#C6F135" stroke-opacity="0.5" stroke-width="1.5" />
    <g transform="translate(20, 20)" stroke="#C6F135" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="32" height="32" rx="4" /><line x1="11" y1="0" x2="11" y2="32" /><line x1="21" y1="0" x2="21" y2="32" />
    </g>
  </g>

  <!-- Header & Title -->
  <g transform="translate(144, 48)">
    <!-- Pill Badge -->
    <rect width="159" height="24" rx="12" fill="#0F172A" stroke="#C6F135" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#C6F135" />
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#C6F135" letter-spacing="0.08em" x="22" y="15.5">KANBAN PIPELINE</text>

    <!-- Main Title -->
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC" x="0" y="60">
      Interactive Pipeline Tracker
    </text>

    <!-- Subtitle -->
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94A3B8" x="0" y="86">
      Full Kanban workflow with live match scoring, salary tracking, and due date reminders.
    </text>
  </g>

  <!-- Details Row Grid -->
  <g transform="translate(144, 160)">
    
      <g transform="translate(0, 0)">
        <rect width="245" height="52" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="26" r="4" fill="#C6F135" />
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0" x="30" y="24">Wishlist → Offer</text>
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#64748B" x="30" y="40">5 customizable stages</text>
      </g>
    
      <g transform="translate(260, 0)">
        <rect width="245" height="52" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="26" r="4" fill="#C6F135" />
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0" x="30" y="24">Match Score Indicator</text>
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#64748B" x="30" y="40">Real-time ATS alignment</text>
      </g>
    
      <g transform="translate(520, 0)">
        <rect width="245" height="52" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
        <circle cx="16" cy="26" r="4" fill="#C6F135" />
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0" x="30" y="24">Activity Logs</text>
        <text font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="11" fill="#64748B" x="30" y="40">Audit trails for every role</text>
      </g>
    
  </g>
</svg>