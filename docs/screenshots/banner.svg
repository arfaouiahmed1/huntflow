<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080A0F" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg-glow)" />
  <rect width="1198" height="318" x="1" y="1" rx="19" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Radar Grid Background -->
  <circle cx="600" cy="140" r="260" stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6" opacity="0.2" />
  <circle cx="600" cy="140" r="160" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.2" />

  <g transform="translate(350, 75)">
    <!-- Icon Container -->
    <g transform="translate(0, 0)">
      <rect width="110" height="110" rx="28" fill="#141C14" stroke="#C6F135" stroke-opacity="0.4" stroke-width="2" />
      <g transform="translate(27, 27)" stroke="#C6F135" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="28" cy="28" r="24" fill="none" />
        <line x1="28" y1="4" x2="28" y2="16" />
        <line x1="28" y1="40" x2="28" y2="52" />
        <line x1="4" y1="28" x2="16" y2="28" />
        <line x1="40" y1="28" x2="52" y2="28" />
        <circle cx="28" cy="28" r="4.5" fill="#C6F135" stroke="none" />
      </g>
      <!-- Active pulse dot -->
      <circle cx="98" cy="12" r="10" fill="#C6F135" filter="url(#glow)" opacity="0.6" />
      <circle cx="98" cy="12" r="6" fill="#D4FF00" />
    </g>

    <!-- Text -->
    <g transform="translate(138, 42)">
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="64" letter-spacing="-0.02em" x="0" y="30">
        <tspan fill="#F8FAFC">HUNT</tspan><tspan fill="url(#flow-grad)">FLOW</tspan>
      </text>
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="0.34em" fill="#94A3B8" x="4" y="68">
        JOB SEARCH OS
      </text>
    </g>
  </g>

  <!-- Tagline -->
  <g transform="translate(440, 240)">
    <rect width="320" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#C6F135" />
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#C6F135" letter-spacing="0.1em" x="34" y="21">LOCAL-FIRST · BYOK · ZERO CLOUD</text>
  </g>
</svg>