[project]
name = "huntflow-agent"
version = "0.1.0"
description = "Scrapling-powered scraping & auto-apply agent for HUNTFLOW"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapling[fetchers]>=0.4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
